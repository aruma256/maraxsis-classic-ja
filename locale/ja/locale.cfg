[tips-and-tricks-item-description]
maraxsis-briefing=[planet=maraxsis]は全域が水に覆われ、島は1つもない。[entity=maraxsis-diesel-submarine]がなければ15分で溺れてしまう。[entity=chemical-plant]と[entity=maraxsis-hydro-plant]を除くほとんどの機械は高い水圧に耐えられず、[entity=maraxsis-pressure-dome]の中でしか稼働しない。[fluid=maraxsis-saline-water]は、どこにでも[entity=offshore-pump]を設置して汲み上げられる。バイオームは海洋平原、サンゴ礁、深海の海溝の3種類。[fluid=lava]は海溝で見つかるが、[fluid=maraxsis-atmosphere]、[item=carbon-fiber]、[item=tungsten-plate]など、多くの資材は他の惑星から運ぶ必要がある。[entity=rocket-silo]からロケットを打ち上げるには、先に[technology=maraxsis-project-seadragon]を研究する必要がある。
maraxsis-trench-exploration=マラクシスを探索していると、地殻に深い裂け目が見つかることがある。海溝の入口は[planet=maraxsis]の地表で最も低い場所にあり、[entity=cliff-maraxsis]の等高線を横切る方向に進むと見つけられる。裂け目は数千キロメートル下の海溝まで続いている。[tile=maraxsis-trench-entrance]の上で[item=maraxsis-diesel-submarine]に乗り、__CONTROL__maraxsis-trench-submerge__を使うと潜航できる。深海の海溝は完全な暗闇で、[item=night-vision-equipment]は機能しない。[item=maraxsis-diesel-submarine]か[item=maraxsis-nuclear-submarine]に守られなければ、30秒で押しつぶされる。[entity=maraxsis-hydro-plant]は海溝でモジュールスロットが4つ増える。海溝の地熱噴出孔から[fluid=lava]を採取し、[fluid=molten-iron]、[fluid=molten-copper]、[item=sulfur]に加工できる。
maraxsis-underwater-machines=[entity=chemical-plant]と[entity=maraxsis-hydro-plant]は密閉され、高い水圧の下でも使えるように設計されている。しかし、[planet=maraxsis]の水中では多くの機械が稼働しない。\n\n[planet=maraxsis-trench]で使用禁止の機械:\n- [entity=rocket-silo], [entity=cargo-landing-pad], [entity=locomotive]\n\n水中で稼働する機械:\n- [entity=sp-spidertron-dock], [entity=small-lamp]\n- [entity=chemical-plant], [entity=maraxsis-hydro-plant], [entity=maraxsis-conduit]\n- [entity=transport-belt], [entity=splitter], [entity=underground-belt]\n- [entity=steel-chest], [entity=active-provider-chest], [entity=passive-provider-chest], [entity=requester-chest], [entity=buffer-chest], [entity=storage-chest]\n- [entity=inserter]\n- [entity=constant-combinator], [entity=arithmetic-combinator], [entity=decider-combinator], [entity=selector-combinator]\n- [entity=pipe], [entity=pipe-to-ground], [entity=pump], [entity=storage-tank]\n- [entity=small-electric-pole], [entity=medium-electric-pole], [entity=big-electric-pole], [entity=substation]\n- [entity=solar-panel], [entity=stone-wall], [entity=gate]\n• [entity=accumulator], [entity=heat-pipe]\n\n[entity=maraxsis-pressure-dome]が必要な機械:\n- [entity=maraxsis-salt-reactor], [entity=maraxsis-oversized-steam-turbine], [entity=boiler], [entity=steam-engine], [entity=heating-tower]\n- [entity=nuclear-reactor], [entity=heat-exchanger], [entity=steam-turbine]\n- [entity=fusion-reactor], [entity=fusion-generator]\n- [entity=beacon]\n- [entity=assembling-machine-1], [entity=assembling-machine-2], [entity=assembling-machine-3]\n- [entity=stone-furnace], [entity=steel-furnace], [entity=electric-furnace]\n- [entity=oil-refinery], [entity=centrifuge], [entity=recycler]\n- [entity=foundry], [entity=electromagnetic-plant], [entity=biochamber], [entity=cryogenic-plant]\n- [entity=lab], [entity=biolab]\n\n[entity=maraxsis-pressure-dome]の中には設置できないが、海底には設置できる機械:\n- [entity=gun-turret], [entity=laser-turret], [entity=rocket-turret], [entity=tesla-turret], [entity=railgun-turret]\n- [entity=land-mine], [entity=rocket-silo]\n- [entity=electric-mining-drill], [entity=big-mining-drill]\n\n水中ではまったく稼働しない機械:\n- [entity=artillery-turret], [entity=artillery-wagon]\n- [entity=car], [entity=tank], [entity=spidertron]\n- [entity=roboport], [entity=radar], [entity=flamethrower-turret]\n\n[tile=lava]の上に設置できる機械:\n- [entity=duct-small], [entity=duct-t-junction], [entity=duct-curve], [entity=duct-cross]\n\n[entity=locomotive]は水中でも走行するが、海底に線路を敷く際には[entity=rail-support]を使う必要がある。\n[entity=train-stop]と[entity=rail-ramp]は[entity=maraxsis-pressure-dome]の中にしか建設できない。

