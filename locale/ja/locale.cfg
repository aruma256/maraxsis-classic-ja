[entity-description]
maraxsis-diesel-submarine=深海を探索できる多用途の乗り物。__CONTROL_MOVE__で操縦できる。__CONTROL__maraxsis-trench-submerge__か「潜航」の待機条件を使って海溝へ潜る。\n経路に沿って走行し、自動的に海溝へ潜るよう設定できる。
maraxsis-nuclear-submarine=速度と積載量を強化した原子力潜水艦。__CONTROL_MOVE__で操縦できる。__CONTROL__maraxsis-trench-submerge__か「潜航」の待機条件を使って海溝へ潜る。\n経路に沿って走行し、自動的に海溝へ潜るよう設定できる。
maraxsis-hydro-plant=高い水圧に耐える多目的流体処理設備。深海の海溝または宇宙に設置すると、モジュールスロットが4つ増える。どんな流体も廃棄できる。
maraxsis-pressure-dome=深海の水圧から機械を守る巨大な構造物。内部を正圧に保つには、[fluid=maraxsis-atmosphere]を常時供給する必要がある。この流体は[planet=maraxsis]以外の惑星で[entity=chemical-plant]を使い、材料なしで作れる。\n加圧されたドームの外にある機械は浸水する。
maraxsis-pressure-dome-collision=深海の水圧から機械を守る巨大な構造物。内部を正圧に保つには、[fluid=maraxsis-atmosphere]を常時供給する必要がある。\n加圧されたドームの外にある機械は浸水する。
maraxsis-salt-reactor=[item=msr-fuel-cell]内のエネルギーを解放し、[fluid=water]を沸騰させて[fluid=maraxsis-supercritical-steam]に変える高度な原子炉。[fluid=maraxsis-supercritical-steam]は[entity=pipe]で転送できず、[entity=maraxsis-salt-reactor]、[entity=maraxsis-oversized-steam-turbine]、およびすべての種類の[entity=duct-small]を通してのみ転送できる。
maraxsis-coral=海洋生物の生物多様性が高い海中バイオーム。
maraxsis-fishing-tower=魚を引き寄せて捕獲する自動漁獲設備。[item=maraxsis-fish-food]が必要。[tile=lowland-cream-red-underwater]のサンゴ礁タイルに設置する。
maraxsis-regulator=ドームに正圧を供給するために[fluid=maraxsis-atmosphere]を消費する。大気消費率についてはFactoriopediaを参照。電力供給時は、水中の[entity=roboport]および[entity=radar]として機能する。
maraxsis-trench-duct=流体を海溝へ直接往復させる非常に長く耐久性のあるパイプ。\n[tile=maraxsis-trench-entrance]上に設置する必要がある。\n経路を空けるには[item=cliff-explosives]が必要。\nこのダクトは、[entity=offshore-pump]と同様に海溝入り口の端に設置する必要がある。
maraxsis-trench-duct-lower=流体を海溝へ直接往復させる非常に長く耐久性のあるパイプ。
maraxsis-conduit=海底にも陸上にも設置できる高性能ビーコン。広範囲をカバーし、品質モジュールを搭載できる。コンジットを追加で設置するたびに、新たな1基の分配効率は前の1基の半分になる。
maraxsis-polylplast=数百万もの微小な動物の集合体。
maraxsis-oversized-steam-turbine=高効率の再生式蒸気タービン。[fluid=water]を毎秒2消費する。[fluid=maraxsis-supercritical-steam]は[entity=pipe]で輸送できず、[entity=maraxsis-salt-reactor]、[entity=maraxsis-oversized-steam-turbine]、および各種[entity=duct-small]を通してのみ輸送できる。蒸気の温度が高いほど、得られるエネルギーが増える。
maraxsis-chimney=[space-location=maraxsis-trench]で見つかる。

[quality-tooltip]
atmosphere-consumption=品質が高いほど、[fluid=maraxsis-atmosphere]の消費量が減少する。

