maraxsis=マラクシス
maraxsis-trench=海溝

[space-location-description]
maraxsis=広大な海に完全に覆われた惑星。水圧は極めて高く、潜水艦に守られなければ海に押しつぶされる。多くの機械は[entity=maraxsis-pressure-dome]の中でしか稼働しない。
maraxsis-trench=マラクシスの海面で潜水艦を潜航させたときだけ到達できる深海の海溝。完全な暗闇の中で、時折見つかる地熱噴出孔だけが光を放つ。そこから[fluid=lava]と[item=sulfur]を採取できる。

