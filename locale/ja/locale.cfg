[technology-description]
cargo-landing-pad-capacity=高度なロケット制御システムでカーゴ降着パッドを正確に追跡する。レベルごとに、カーゴ降着パッドをさらに1基設置できる。
hydraulic-science-pack=最先端の深海技術を研究できるようになる。
maraxsis-nuclear-submarine=速度、装備グリッド、積載量を強化した原子力潜水艦。
maraxsis-glassworking=窓などの構造物に使う透明な素材。高い圧縮強度を持ち、深海での建築にも使える。
maraxsis-wyrm-confinement=[planet=maraxsis]に生息する捕獲困難なワームを捕らえて収容し、その一部を科学研究に利用する。
maraxsis-hydro-plant=塩水と汽水を淡水と塩の結晶に加工する。
maraxsis-piscary=[planet=maraxsis]の深海に持続可能な漁場を作る。
maraxsis-depth-charges=新世代の爆発兵器を作る。
maraxsis-sonar=音波を使って水中の物体を探知する。陸上にも設置でき、広範囲を探知できる。
maraxsis-salt-reactor=[item=msr-fuel-cell]内のエネルギーを解放し、[fluid=water]を沸騰させて[fluid=maraxsis-supercritical-steam]に変える高度な原子炉。
maraxsis-deepsea-research=さまざまな流体を使って実験し、より高品質なサイエンスパックを作る。
kr-quantum-computer=より高品質なサイエンスパックを作成するために設計された、高度に専門化された深海研究用コンピュータ。大量のエネルギーを必要とする。
maraxsis-project-seadragon=浮力を利用して、[planet=maraxsis]の水中にロケットサイロを建設できるようになる。
maraxsis-abyssal-diving-gear=自分が潜水艦になろう。酸素を生成し、[planet=maraxsis]の水圧に耐える高度な装備を開発する。複数装備すると、すべての効果が重複する。
ducts=到達距離と地下敷設距離が長い大規模なパイプラインを設計する。タングステンダクトは[tile=water]と[tile=lava]の上にも設置できる。[entity=maraxsis-trench-duct]を使えば、[planet=maraxsis-trench]との間で流体を直接輸送できる。
maraxsis-liquid-atmosphere=[planet=aquilo]で[fluid=maraxsis-atmosphere]を極低温で液化する技術を開発する。液体大気は気体より100倍高密度。樽詰めと樽からの取り出しは[entity=cryogenic-plant]内で行う必要がある。
sp-spidertron-automation=車両の自動巡回と、ドックでの潜水艦やスパイダートロンの自動積み下ろしを可能にする。「潜航」の待機条件を使い、[planet=maraxsis-trench]へのアイテム輸送も自動化できる。
maraxsis-stone-centrifuging=遠心分離によって、石に含まれる微量のウランを取り出す。
maraxsis-glass-productivity=ガラス加工レシピの生産量を増やす。
maraxsis-research-vessel=[item=maraxsis-glass-panes]の高い圧縮強度を利用し、サイエンスパックを加圧してスタックサイズを小さくする。

