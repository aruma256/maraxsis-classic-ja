name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Package mod
        id: package
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile

          info = json.loads(Path('info.json').read_text(encoding='utf-8'))
          tag = os.environ['TAG_NAME']
          expected_tag = f"v{info['version']}"
          if tag != expected_tag:
              raise SystemExit(f'Tag {tag} does not match info.json version {expected_tag}')

          name = f"{info['name']}_{info['version']}"
          asset = f'{name}.zip'
          with ZipFile(asset, 'w', compression=ZIP_DEFLATED) as archive:
              for path in ('info.json', 'LICENSE', 'locale/ja/locale.cfg'):
                  archive.write(path, f'{name}/{path}')

          with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as output:
              output.write(f'asset={asset}\n')
          PY

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
          RELEASE_ASSET: ${{ steps.package.outputs.asset }}
        run: gh release create "$TAG_NAME" "$RELEASE_ASSET" --verify-tag --generate-notes --title "$TAG_NAME"
